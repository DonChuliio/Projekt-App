<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#121212">
<title>Dock – Bring! Export</title>
<link rel="icon" href="dock-icon-180.png">
<style>
:root{color-scheme:dark;--bg:#121212;--surface:#1e1e1e;--border:#2a2a2a;--text:#eaeaea;--muted:#9aa0a6;--petrol:#2bb0a6}
*{box-sizing:border-box}body{margin:0;padding:24px;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:520px;margin:0 auto}.card{padding:20px;background:var(--surface);border:1px solid var(--border);border-radius:14px}
h1{margin:0 0 8px;font-size:24px}.muted{color:var(--muted)}ul{padding-left:22px}li{padding:5px 0}
.back{display:inline-block;margin-top:18px;color:var(--petrol);text-decoration:none}
#bring-slot{margin-top:18px}
</style>
<script>
(function(){
 const params=new URLSearchParams(location.search);
 const name=(params.get("name")||"Dock Packliste").trim();
 const items=params.getAll("item").map(x=>x.trim()).filter(Boolean);
 const recipe={
  "@context":"https://schema.org",
  "@type":"Recipe",
  "name":name,
  "author":{"@type":"Person","name":"Dock"},
  "image":"https://donchuliio.github.io/Projekt-App/dock-icon-512.png",
  "recipeYield":"1 Packliste",
  "recipeIngredient":items
 };
 const ld=document.createElement("script");
 ld.type="application/ld+json";
 ld.text=JSON.stringify(recipe);
 document.head.appendChild(ld);
 window.DOCK_BRING_EXPORT={name,items};
})();
</script>
</head>
<body>
<main>
<div class="card">
<h1 id="export-title">Dock Packliste</h1>
<p class="muted">Diese Auswahl wird an Bring! übergeben.</p>
<ul id="export-items"></ul>
<div id="bring-slot"><div data-bring-import="" style="display:none"></div></div>
<p id="empty" class="muted" hidden>Keine Einträge für den Export ausgewählt.</p>
</div>
<a class="back" href="./">Zurück zu Dock</a>
</main>
<script>
(function(){
 const data=window.DOCK_BRING_EXPORT;
 document.getElementById("export-title").textContent=data.name;
 const list=document.getElementById("export-items");
 data.items.forEach(item=>{const li=document.createElement("li");li.textContent=item;list.appendChild(li);});
 if(!data.items.length){
  document.getElementById("empty").hidden=false;
  document.getElementById("bring-slot").hidden=true;
  return;
 }
 const script=document.createElement("script");
 script.async=true;
 script.src="https://platform.getbring.com/widgets/import.js";
 document.body.appendChild(script);
})();
</script>
</body>
</html>
