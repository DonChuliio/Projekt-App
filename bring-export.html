<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#121212">
<title>Dock – Bring! Export</title>
<style>
:root{color-scheme:dark;--bg:#121212;--surface:#1e1e1e;--border:#2a2a2a;--text:#eaeaea;--muted:#9aa0a6;--petrol:#2bb0a6}
*{box-sizing:border-box}body{margin:0;padding:24px;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:520px;margin:auto}.card{padding:20px;background:var(--surface);border:1px solid var(--border);border-radius:14px}
h1{margin:0 0 8px;font-size:24px}.muted{color:var(--muted)}li{padding:5px 0}.back{display:inline-block;margin-top:18px;color:var(--petrol)}
</style>
</head>
<body>
<main><div class="card">
<h1 id="title">Dock Packliste</h1>
<p id="status" class="muted">Export wird geladen...</p>
<ul id="items"></ul>
<div id="bring-slot"></div>
</div><a class="back" href="./">Zurück zu Dock</a></main>
<script>
(async function(){
 const id=new URLSearchParams(location.search).get("id");
 const status=document.getElementById("status");
 if(!id){status.textContent="Export-ID fehlt.";return;}
 try{
  const response=await fetch("https://osmmjfuzuxhwtfcttdxp.supabase.co/functions/v1/bring-export?id="+encodeURIComponent(id));
  if(!response.ok)throw new Error("Export nicht gefunden");
  const data=await response.json();
  const items=Array.isArray(data.items)?data.items.map(String).filter(Boolean):[];
  if(!items.length)throw new Error("Keine Einträge gefunden");

  document.getElementById("title").textContent=data.name||"Dock Packliste";
  status.textContent="Diese Auswahl wird an Bring! übergeben.";
  const list=document.getElementById("items");
  items.forEach(function(item){const li=document.createElement("li");li.textContent=item;list.appendChild(li);});

  const recipe={"@context":"https://schema.org","@type":"Recipe","name":data.name||"Dock Packliste","author":{"@type":"Person","name":"Dock"},"image":"https://donchuliio.github.io/Projekt-App/dock-icon-512.png","recipeYield":"1 Packliste","recipeIngredient":items};
  const ld=document.createElement("script");ld.type="application/ld+json";ld.textContent=JSON.stringify(recipe);document.head.appendChild(ld);

  const widget=document.createElement("div");widget.setAttribute("data-bring-import","");widget.style.display="none";document.getElementById("bring-slot").appendChild(widget);
  const script=document.createElement("script");script.async=true;script.src="https://platform.getbring.com/widgets/import.js";document.body.appendChild(script);
 }catch(error){console.error(error);status.textContent="Der Export konnte nicht geladen werden.";}
})();
</script>
</body>
</html>
